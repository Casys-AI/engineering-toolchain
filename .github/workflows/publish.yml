name: Publish image

on:
  push:
    branches:
      - main

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # A bump that misses one file still builds and publishes; the container
      # then dies at startup on a cache miss. Catch the disagreement first.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify pinned versions agree
        run: deno task verify:pins

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/casys-ai/engineering-toolchain:latest
            ghcr.io/casys-ai/engineering-toolchain:${{ github.sha }}
